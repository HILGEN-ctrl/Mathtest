<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathTest</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .card {
            width: min(90%, 700px);
            padding: 50px;
            border-radius: 30px;
            background: rgba(255,255,255,.15);
            backdrop-filter: blur(15px);
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
        }

        h1 {
            font-size: 48px;
            margin: 0 0 15px;
        }

        p {
            font-size: 20px;
            opacity: .9;
        }

        button {
            margin-top: 25px;
            padding: 16px 30px;
            border: 0;
            border-radius: 14px;
            font-size: 18px;
            cursor: pointer;
            background: white;
            color: #6046a8;
            font-weight: bold;
        }

        button:hover {
            transform: scale(1.03);
        }
    </style>
</head>

<body>

<div class="card">
    <h1>🧮 MathTest</h1>

    <p>
        Генератор и проверка математических работ
    </p>

    <button onclick="alert('Сайт работает! 🎉')">
        Начать
    </button>
</div>

</body>
</html>
